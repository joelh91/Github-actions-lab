apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app
  namespace: ci-troubleshooting

spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-app

  template:
    metadata:
      labels:
        app: broken-app

    spec:
      containers:
        - name: broken-app
          image: python:3.13-slim
          command: ["python3", "-c"]
          args:
            - |
              import os
              import time
              print("Starting application...")
              
              database_url = os.environ.get("DATABASE_URL")

              if not database_url:
                  raise Exception("DATABASE_URL is missing")
             
              print("Application started successfully", flush=True)

              while True:
                 time.sleep(60)
