name: CI pipeline

on:
  push:
    branches:
      - main
      - "feature-*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: app.py

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: use pratice secret
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: echo "Secret is configure"
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: python version
        run: python3 --version

      - name: run application
        run: python3 $APP_NAME

  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: installing python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: installing dependencies
        run: python3 -m pip install -r requirements.txt

      - name: testing application
        run: python3 -m pytest
