name: CI pipeline

on:
  push:
    branches:
      - main
      - "feature-*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: app.py

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: use practice secret
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: echo "Secret is configured"

      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: python version
        run: python3 --version

      - name: run application
        run: python3 $APP_NAME

  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: installing python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: installing dependencies
        run: python3 -m pip install -r requirements.txt

      - name: testing application
        run: python3 -m pytest

  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::203918843788:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: verify AWS identity
        run: aws sts get-caller-identity

      - name: login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build docker image
        run: docker build -t 203918843788.dkr.ecr.us-east-1.amazonaws.com/mini-python-repo:v1 .

      - name: push docker image to ECR
        run: docker push 203918843788.dkr.ecr.us-east-1.amazonaws.com/mini-python-repo:v1
