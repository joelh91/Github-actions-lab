name: CI pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python version
        run: python3 --version

      - name: run application
        run: python3 app.py

  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: installing dependencies
        run: python3 -m pip install -r requirements.txt

      - name: testing application
        run: python3 -m pytest
